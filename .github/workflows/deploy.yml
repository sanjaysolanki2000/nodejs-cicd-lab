name: Deploy Node js Application on the AWS

on: 
  push:
    branches: 
      - main

jobs:
  deploy: 
    runs-on: ubuntu-latest

    steps:
      - name: checkout code 
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.aws_ip}}
          username: ${{secrets.aws_ssh_username}}
          key: ${{secrets.aws_ssh_key}}
          script: |
            cd /var/www/html/nodejs-cicd-lab
            git pull
            docker compose up -d --build
          



          
         



    